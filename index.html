    var m=s.match(/^(\d{1,2})[-\/](\d{1,2})[-\/](\d{4})$/);
    if(m)return m[3]+'-'+U.pad(parseInt(m[2],10),2)+'-'+U.pad(parseInt(m[1],10),2);
    m=s.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/);
    if(m)return m[1]+'-'+U.pad(parseInt(m[2],10),2)+'-'+U.pad(parseInt(m[3],10),2);
    return s;
  },
  identidadDoc: function (p) {
    return Pedidos.fechaCanon(p.fecha)+'|'+U.norm(p.tipoDocumento)+'|'+U.norm(p.numeroDocumento)+'|'+U.norm(p.numero);
  },
  existeIdentidad: function (p) {
    var k=Pedidos.identidadDoc(p);
    return U.find(Pedidos.lista,function(x){return x.estado!=='ELIMINADO'&&Pedidos.identidadDoc(x)===k;});
  },
  _limpiarCelda: function(s){return U.trim(String(s==null?'':s).replace(/^\|+|\|+$/g,'').replace(/^["']|["']$/g,''));},
  _filaTabla: function(linea) {
    var s=U.trim(linea), f, i;
    if(!s || /^\|?\s*:?-{2,}/.test(s))return null;
    if(s.indexOf('|')>=0) {
      f=s.split('|'); var z=[]; for(i=0;i<f.length;i++){var c=Pedidos._limpiarCelda(f[i]);if(c!=='' || (i>0&&i<f.length-1))z.push(c);}
      return z;
    }
    if(s.indexOf('\t')>=0)return s.split('\t');
    if(s.indexOf(';')>=0)return s.split(';');
    return s.split(',');
  },
  importarPegado: function (txt) {
    txt=String(txt||'').replace(/^\ufeff/,'');
    var ls=txt.split(/\r?\n/), filas=[], i, f;
    for(i=0;i<ls.length;i++){f=Pedidos._filaTabla(ls[i]);if(f&&f.length)filas.push(f);}
    if(!filas.length)return {ok:false,error:'No hay filas para importar'};
    var mapa={}, inicio=0, cab=filas[0], reconocidas=0;
    for(i=0;i<cab.length;i++){
      var k=U.sinAcentos(U.norm(cab[i])).replace(/[^A-Z0-9]/g,'');
      if(/^(MP|ORIGEN|CANAL)$/.test(k)){mapa.origen=i;reconocidas++;}
      else if(/^(PEDIDO|NUMEROPEDIDO|ORDEN|NUMEROORDEN|ORDENTICKET|TICKET|OC|NUMEROOC)$/.test(k)){mapa.numero=i;reconocidas++;}
      else if(/^(TIPODOCUMENTO|DOCUMENTOTIPO|TIPODOC)$/.test(k)){mapa.tipoDocumento=i;reconocidas++;}
      else if(/^(NUMERODOCUMENTO|NUMERODOC|DOCUMENTO|NRODOCUMENTO|NRODOC|NDOCUMENTO|NDOC|NUMDOC|FOLIO)$/.test(k)){mapa.numeroDocumento=i;reconocidas++;}
      else if(/^FECHA/.test(k)){mapa.fecha=i;reconocidas++;}
      else if(/^(TOTAL|MONTO|VALOR|IMPORTE)$/.test(k)){mapa.monto=i;reconocidas++;}
    }
    if(reconocidas>=3 && mapa.numero!=null){inicio=1;}
    else {
      mapa={origen:0,numero:1,tipoDocumento:2,numeroDocumento:3,fecha:4,monto:5}; inicio=0;
    }
    var nuevos=0, duplicados=0, invalidos=0, completados=0, agregados=[], revisar=[];
    for(i=inicio;i<filas.length;i++){
      f=filas[i];
      var get=function(k){return mapa[k]==null?'':Pedidos._limpiarCelda(f[mapa[k]]||'');};
      var p={origen:get('origen')||'EXCEL',tipo:'PEDIDO',numero:get('numero'),tipoDocumento:get('tipoDocumento'),
        numeroDocumento:get('numeroDocumento'),fecha:Pedidos.fechaCanon(get('fecha')),
        monto:get('monto'),observacion:''};
      if(!p.numero||!p.tipoDocumento||!p.numeroDocumento||!p.fecha){invalidos++;continue;}
      if(Pedidos.existeIdentidad(p)){duplicados++;continue;}
      var mismo=U.find(Pedidos.lista,function(x){return x.estado!=='ELIMINADO'&&Pedidos.clave(x.origen,x.tipo,x.numero)===Pedidos.clave(p.origen,p.tipo,p.numero);});
      if(mismo){
        if(!U.trim(mismo.numeroDocumento)){
          var rc=Pedidos.upsert({id:mismo.id,origen:mismo.origen,tipo:mismo.tipo,numero:mismo.numero,fecha:mismo.fecha||p.fecha,tipoDocumento:p.tipoDocumento,numeroDocumento:p.numeroDocumento});
          if(rc.ok){if(p.monto)rc.pedido.monto=p.monto;Pedidos.guardar();completados++;agregados.push(rc.pedido);}
        } else revisar.push(p.numero+' ('+p.tipoDocumento+' '+p.numeroDocumento+' ≠ registrado '+mismo.tipoDocumento+' '+mismo.numeroDocumento+')');
        continue;
      }
      var otros=Pedidos.duplicados(p,null);
      var r=Pedidos.upsert(p);
      if(r.ok){r.pedido.monto=p.monto; Pedidos.guardar(); nuevos++; agregados.push(r.pedido); if(otros.length)revisar.push(p.numero+' (nuevo; '+otros[0].motivo+' que '+otros[0].p.numero+')');}
      else invalidos++;
    }
    return {ok:true,nuevos:nuevos,duplicados:duplicados,invalidos:invalidos,completados:completados,revisar:revisar,agregados:agregados};
  },
  marcarCubicado: function (id) {
    var p=Pedidos.porId(id); if(!p)return;
    p.estado='CUBICADO'; p.actualizado=new Date().toISOString(); SyncReg.marcar(p); Pedidos.guardar();
  },
  estadoOperativo: function(p) {
    if(!p)return 'RECIBIDO';
    if(p.estado==='ENTREGADO'||p.estado==='CANCELADO')return p.estado;
    return Pedidos.evidencia(p)||p.estado;
  },
  evidencia: function(p) {
    var key=OT.docKey(p.numero,p.tipoDocumento,p.numeroDocumento), tieneCub=false, tieneOT=false, total=0, desp=0, ret=0;
    U.each(CubPool.lista,function(b){
      if(b.estado==='ELIMINADO')return;
      if(b.pedidoId===p.id || OT.docKey(b.orden,b.tipoDocumento,b.numeroDocumento)===key)tieneCub=true;
    });
    U.each(OT.lista,function(ot){
      var bs=OT.bultosDoc(ot,key);
      if(bs.length)tieneOT=true;
      U.each(bs,function(b){total++;if(b.verificadoCourier||b.despachoId||b.despachado||b.etapa==='DESPACHADO')desp++;if(b.retiro)ret++;});
    });
    if(total>0 && desp===total)return ret===total?'ENTREGADO':'ENVIADO';
    if(tieneOT)return 'EN PREPARACIÓN';
    if(tieneCub)return 'CUBICADO';
    return '';
  },
  reconciliarEstados: function() {
    var cambio=false;
    U.each(Pedidos.lista,function(p){
      var e=Pedidos.estadoOperativo(p);
      if(e!==p.estado && p.estado!=='ENTREGADO' && p.estado!=='CANCELADO' && Pedidos.estados.indexOf(p.estado)>=0){p.estado=e;p.actualizado=new Date().toISOString();SyncReg.marcar(p);cambio=true;}
    });
    if(cambio){Pedidos.guardar();if(typeof Sync!=='undefined')Sync.programar(2000);}
  }
};

      r: 'Cada bulto lleva <b>dos etiquetas</b> que deben coincidir:<br>1. <b>Rótulo interno</b> (Cubicación → ETIQUETAS): orden, documento y <b>BULTO n DE N</b>. Se pega al cubicar.<br>2. <b>Etiqueta del courier</b>: llega después.<br><br><b>Correos de Chile</b>: un envío = un bulto. La extensión escribe la marca <i>ORDEN TIPO N° Bn/N</i> en «Detalle del envío». Después del pago, en «Mi historial de envíos» pulse <b>Registrar</b>: el seguimiento queda junto al bulto. En bodega use <b>Rotulado → PAREO CORREOS</b> y escanee la etiqueta: le dice «PEGAR EN BULTO n/N».<br><b>Otros couriers</b>: en <b>Despacho</b> escanee la orden del courier sobre cada bulto; Satélite avisa si no corresponde.<br><br>También puede escribirme el N° de seguimiento u orden del courier y le digo en qué bulto va.', ir: ['Ir a Pareo Correos', 'ir:pareo'] },

    { id: 'rotulo', t: 'Etiquetas de bulto: formatos y numeración', k: ['formato', 'formatos', 'imprimir etiqueta', 'etiqueta de bulto', 'etiquetas de bulto', '60x29', '60x40', 'numeracion', '1/n', 'n de n'],
      r: 'Las etiquetas de bulto se imprimen desde <b>Cubicación → ETIQUETAS</b> o desde <b>Packing</b>. El formato se elige al imprimir; el de uso habitual se fija en <b>Datos → Formato etiqueta de bulto</b>, y se editan en <b>Rotulado → FORMATOS</b> (sección bultos). La numeración <b>n DE N</b> cuenta todos los bultos del documento, estén cubicados o ya en una OT, así que sale igual en Cubicación y en Packing.', ir: ['Ir a Rotulado', 'ir:rotulado'] },

      r: 'La extensión trabaja en el portal de Correos (en Chrome de computador):<br>1. Busque el documento y pulse <b>Transferir medidas y peso</b> (un envío por bulto); también transfiere destinatario y remitente.<br>2. Antes de pagar, <b>Vincular</b> deja el ID de Correos junto al bulto.<br>3. Después de pagar, en «Mi historial de envíos» pulse <b>Registrar</b>: guarda el N° de seguimiento.<br>«Historial por día» filtra los envíos del día y los numera #01, #02… La extensión nunca confirma ni paga: eso lo hace usted.' },
    { id: 'envio', t: 'Datos de envío: destinatario y remitente', k: ['destinatario', 'remitente', 'direccion', 'datos de envio', 'comuna', 'region'],

    { id: 'ubicaciones', t: 'Ubicaciones y números de ingreso', k: ['ubicacion', 'import', 'erp', 'ingreso', 'ubicaciones por ingreso', 'importar ubicaciones', 'cambiar ubicacion', 'corregir ubicacion', 'actualizar ubicacion', 'ingreso erp', 'numero de ingreso', 'xls'],

  faqBuscar: function (txt) {

CatUI.guardarUbicaciones = function (cUbi, confirmar, cb) {

  if (!ProdSync.activo()) {
    U.each(cUbi, function (c) { var o = Ubicaciones.porId[c.id]; if (o) { o.ubicacion = c.ubicacion; o.fuente = 'BODEGA'; o.actualizado = new Date().toISOString(); o.usuario = ProdSync.operador(); } });

    cb(true, cUbi.length + ' ubicación(es) por ingreso guardadas solo en este equipo');
    return;
  }
  if (!ProdSync.operador()) { cb(false, 'Indique el responsable del cambio'); return; }
  Sync.llamar('satUbicacionesGuardar', { cambios: cUbi, confirmar: !!confirmar, usuario: ProdSync.operador(), dispositivo: DB.cfg.sync.dispositivo }, function (r) {
    if (r && r.conflictos && r.conflictos.length) {
      var t = U.map(r.conflictos, function (c) { return 'Ingreso ' + c.ingreso + ': usted vio «' + (c.base || 'vacío') + '», en la hoja ahora hay «' + (c.actual || 'vacío') + '»'; }).join('\n');
      UI.confirmar('Otra persona cambió estas ubicaciones mientras usted editaba:\n\n' + t + '\n\n¿Guardar su versión de todas formas?', function () { CatUI.guardarUbicaciones(cUbi, true, cb); }, { si: 'GUARDAR MI VERSIÓN', titulo: 'Cambio simultáneo' });

    '<label class="lbl" for="cfMedido">LA BARRA DE 40 mm MIDIÓ (mm)</label><div class="fila"><div class="c"><input id="cfMedido" class="inp sm" type="number" step="0.5" min="5" max="300" placeholder="ej. 14"></div><div class="c"><button class="btn btn-ok btn-sm" data-a="zoomCalc" style="margin:0">CALCULAR ZOOM</button></div></div>' +
    '<div id="cfZoomInfo" class="muted"></div></div>' +
    '<label class="lbl">COURIERS (uno por línea)</label><textarea id="cfCou" class="inp" style="min-height:120px;font-family:Arial,sans-serif;font-size:15px">' + U.esc(c.couriers.join('\n')) + '</textarea>' +
    '<label class="lbl">CLAVE ADMINISTRADOR (acciones forzosas)</label><input id="cfAdm" class="inp sm" type="password" value="' + U.esc(c.claveAdmin || '') + '">' +
    '<label class="lbl">NOMBRE DE QUIEN AUTORIZA (por defecto)</label><input id="cfAdmNom" class="inp sm" value="' + U.esc(c.nombreAdmin || '') + '">' +
    '<label class="lbl">WHATSAPP PARA "HABLAR CON UNA PERSONA"</label><input id="cfWsp" class="inp sm" inputmode="tel" maxlength="20" placeholder="56912345678" value="' + U.esc(c.whatsapp || '') + '">' +
    '<label class="lbl">PREFIJO DE ESTE EQUIPO</label><input id="cfEq" class="inp sm" maxlength="6" autocapitalize="characters" value="' + U.esc(c.equipo) + '">' +
    '<div class="muted">Con varios equipos, un prefijo distinto evita números de OT repetidos.</div>' +
    '<button class="btn btn-ok" data-a="guardarCfg">GUARDAR CONFIGURACIÓN</button></div>';
  h += '<div class="card"><h2>Remitente por defecto (envíos)</h2><div class="muted">Se usa en los datos de envío de cada pedido, salvo que el pedido indique otro. Se comparte con todos los equipos y con la extensión de Correos.</div>' +
    EnvioDatos.formulario('rmD_', EnvioDatos.remitenteDefecto()) +
    '<button class="btn btn-ok" data-a="guardarRem">GUARDAR REMITENTE</button></div>';
  var sy = c.sync, modo = Sync.modo();
  h += '<div class="card"><h2>Sincronización</h2>' +
    '<div class="aviso ' + (modo === 'local' ? 'gris' : (sy.ultimoError ? 'rojo' : 'verde')) + '">' +
    (modo === 'gas' ? 'Conectado desde la hoja Google' : (modo === 'url' ? 'Conectado por URL' : 'SOLO ESTE EQUIPO (sin sincronización)')) + '</div>' +
    '<div class="tot">Pendientes: <b>' + Sync.nPend() + '</b> · Intentos fallidos: <b>' + (sy.intentosFallidos || 0) + '</b><br>Última sincronización: <b>' + (sy.ultimoOk ? U.fechaCL(U.fechaISO(new Date(sy.ultimoOk))) + ' ' + U.hora(new Date(sy.ultimoOk)) : '—') + '</b>' +
    (sy.proximoIntento && sy.proximoIntento > new Date().getTime() ? '<br>Próximo intento en <b>' + Math.ceil((sy.proximoIntento - new Date().getTime()) / 1000) + ' s</b>' : '') +
    (sy.ultimoError ? '<br><span style="color:#c00000">' + U.esc(sy.ultimoError) + '</span>' : '') + '</div>' +
    (modo === 'gas' ? '' : '<label class="lbl">URL DE LA HOJA (termina en /exec)</label><input id="syUrl" class="inp sm" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="' + U.esc((window.SAT_CONFIG && /^https:/.test(SAT_CONFIG.API_URL || '')) ? SAT_CONFIG.API_URL : '') + '" value="' + U.esc(sy.url) + '">') +
    '<label class="lbl">CLAVE DE ACCESO</label><input id="syTok" class="inp sm" type="password" value="' + U.esc(sy.token) + '">' +
    '<button class="btn" data-a="syGuardar">GUARDAR CONEXIÓN</button>' +
    '<div class="btns"><button class="btn btn-ok btn-sm" data-a="syAhora">SINCRONIZAR AHORA</button><button class="btn btn-sec btn-sm" data-a="syProbar">PROBAR</button></div>' +
    '<button class="btn btn-sec btn-sm" data-a="syTodo">VOLVER A DESCARGAR TODO</button>' +
    '<div class="muted">Equipo: ' + U.esc(sy.dispositivo) + '</div></div>';
  h += '<div class="card"><h2>Respaldo</h2>' +
    '<div class="tot">OT: <b>' + OT.lista.length + '</b> · Bultos: <b>' + nb + '</b> · Productos: <b>' + Catalogo.lista.length + '</b> · Formatos: <b>' + DB.formatos.length + '</b><br>' +
    '<span class="muted">Uso almacenamiento: ' + U.fx(StorageManager.uso() / 1024, 0) + ' KB (límite ≈ 5000 KB)</span></div>' +
    '<button class="btn" data-a="exportar">EXPORTAR RESPALDO</button>' +
    (function () { var a = StorageManager.leer(CLAVES.archivados, []); return U.esArray(a) && a.length ? '<button class="btn btn-sec" data-a="verArchivados">DESCARGAR ARCHIVADOS (' + a.length + ')</button><div class="muted">Registros antiguos de este equipo que no estaban en la nube y no se subieron. Se guardan aquí por seguridad.</div>' : ''; })() +
    '<button class="btn btn-sec" data-a="verRespaldo">VER RESPALDO</button>' +
    '<label class="lbl">IMPORTAR RESPALDO (.json)</label><input id="rsFile" type="file" accept=".json,application/json,text/plain" class="inp sm" style="padding:8px">' +
    '<label class="lbl">…o pegar contenido</label><textarea id="rsTxt" class="inp"></textarea>' +
    '<button class="btn btn-sec" data-a="importarTxt">ANALIZAR PEGADO</button></div>';
  var integ = Integridad.verificar();
  h += '<div class="card"><h2>Integridad</h2><div class="aviso ' + (integ.ok ? 'verde' : 'rojo') + '">' + (integ.ok ? 'ARCHIVO COMPLETO · ' + integ.revisados + ' controles OK' : 'FALLAS: ' + U.esc(integ.fallas.join(', '))) + '</div>' +
    '<div class="muted">' + U.esc(APP.nombre) + ' v' + APP.version + ' (' + APP.build + ') · ' + (StorageManager.disponible ? 'localStorage' : 'MEMORIA') + '</div>' +
    (RDM_ERRORES.length ? '<div class="muted" style="margin-top:6px"><b>Errores recientes:</b><br>' + U.map(RDM_ERRORES, U.esc).join('<br>') + '</div>' : '') + '</div>';
  h += '<div class="card"><h2>Zona peligrosa</h2><button class="btn btn-dan" data-a="borrarTodo">BORRAR TODOS LOS DATOS</button></div>';
  m.innerHTML = h;
  var restaurar = function (txt) {
    var obj;
    try { obj = JSON.parse(String(txt).replace(/^\ufeff/, '')); } catch (e) { UI.toast('El archivo no es JSON válido', 'error'); return; }
    var v = StorageManager.validar(obj);
    if (!v.ok) { UI.modal({ titulo: 'Respaldo inválido', html: '<div class="aviso rojo">' + U.esc(v.error) + '</div>' }); return; }
    var r = v.resumen, f = r.fecha ? new Date(r.fecha) : null;
    UI.modal({ titulo: 'Restaurar respaldo', html: '<div class="tot">Fecha: <b>' + (f && !isNaN(f.getTime()) ? U.fechaCL(U.fechaISO(f)) + ' ' + U.hora(f) : '?') + '</b><br>' +
      'Versión: ' + U.esc(r.version) + '<br>OT: <b>' + r.ots + '</b> · Bultos: <b>' + r.bultos + '</b> · Productos: <b>' + r.productos + '</b></div>' +
      '<div class="aviso rojo" style="margin-top:8px">Se REEMPLAZARÁN los datos actuales.</div>' +
      '<label class="chk"><input type="checkbox" id="rsPrev" checked> Descargar respaldo previo</label>',
      botones: [{ txt: 'CANCELAR', cls: 'btn-sec' }, { txt: 'RESTAURAR', cls: 'btn-dan', fn: function () {
        var prevBk = U.$('rsPrev').checked ? JSON.stringify(StorageManager.exportar()) : null, conn = U.clone(DB.cfg.sync);
        var res = StorageManager.importar(obj);
        if (!res.ok) { UI.toast(res.error, 'error', 5000); return; }
        DB.cargar();
        DB.cfg.sync = U.assign(U.clone(SYNC_DEFECTO), { url: conn.url, token: conn.token, dispositivo: conn.dispositivo });
        Sync.marcarTodo(); Sync.programar(1500);
        App.ir('datos');
        UI.toast('Respaldo restaurado', 'ok', 3000);
        if (prevBk) UI.descargar('rdm_respaldo_previo_' + U.sello() + '.json', prevBk, 'application/json', true);
        else UI.cerrarModal();
        return false;
      } }] });
  };
  var Datos_zoom = function (v, silencio) {
    var z = Math.round(parseFloat(v) || 100);
    if (z < 30) z = 30; if (z > 600) z = 600;
    DB.cfg.zoomImpresion = z;
    if (U.$('cfPag')) DB.cfg.paginaImpresion = U.$('cfPag').value;
    DB.guardarCfg();
    if (U.$('cfZoom')) U.$('cfZoom').value = z;
    if (!silencio) UI.toast('Zoom de impresión: ' + z + ' %', 'ok');
  };
  m.onchange = function (e) { if (e.target && (e.target.id === 'cfZoom' || e.target.id === 'cfPag')) Datos_zoom(U.$('cfZoom').value); };
  UI.delegar(m, {
    zoomMenos: function () { Datos_zoom(Impresion.zoom() - 5); },
    zoomMas: function () { Datos_zoom(Impresion.zoom() + 5); },
    calib58: function () { Datos_zoom(U.$('cfZoom').value, true); Impresion.calibrar(58); },
    calib80: function () { Datos_zoom(U.$('cfZoom').value, true); Impresion.calibrar(80); },
    zoomCalc: function () {
      var med = parseFloat(String(U.$('cfMedido').value).replace(',', '.'));
      if (!(med >= 5 && med <= 300)) { UI.toast('Ingrese cuánto midió la barra, en mm', 'error'); return; }
      var nz = Math.round(Impresion.zoom() * 40 / med);
      Datos_zoom(nz);
      U.$('cfMedido').value = '';
      U.$('cfZoomInfo').innerHTML = 'Midió ' + med + ' mm → zoom nuevo <b>' + Impresion.zoom() + ' %</b>. Imprima la calibración otra vez para confirmar.';
    },
    prueba58: function () { if (U.$('cfMi')) { DB.cfg.metodoImpresion = U.$('cfMi').value; DB.guardarCfg(); } Impresion.prueba(58); },
    prueba80: function () { if (U.$('cfMi')) { DB.cfg.metodoImpresion = U.$('cfMi').value; DB.guardarCfg(); } Impresion.prueba(80); },
    guardarCfg: function () {
      var fv = parseInt(U.$('cfFv').value, 10);
      if (!(fv >= 1000 && fv <= 10000)) { UI.toast('Factor volumétrico entre 1000 y 10000', 'error'); return; }
      var cambioFv = fv !== c.factorVol;
      c.empresa = U.trim(U.$('cfEmp').value) || 'RD MUSICO';
      c.subtitulo = U.trim(U.$('cfSub').value);
      c.factorVol = fv;
      c.barraBulto = U.$('cfBb').checked;
      if (U.$('cfFb')) c.formatoBulto = U.$('cfFb').value;
      c.autoImprimir = U.$('cfAi').checked;
      if (U.$('cfMi')) c.metodoImpresion = U.$('cfMi').value;
      var cous = [];
      U.each(U.$('cfCou').value.split(/\r?\n/), function (x) { x = U.norm(x); if (x && cous.indexOf(x) < 0) cous.push(x); });
      if (cous.length) c.couriers = cous;
      c.claveAdmin = String(U.$('cfAdm').value || '');
      c.nombreAdmin = U.trim(U.$('cfAdmNom').value);
      c.equipo = U.norm(U.$('cfEq').value).replace(/[^A-Z0-9]/g, '');
      if (U.$('cfWsp')) c.whatsapp = String(U.$('cfWsp').value || '').replace(/[^0-9]/g, '');
      DB.guardarCfg();
      Compartida.subir(function (ok) { if (ok) UI.toast('Configuración guardada y compartida con todos los equipos', 'ok', 3500); });
      if (cambioFv) { var n = OT.recalcularPesoVol(); UI.toast('Guardado. Peso volumétrico recalculado en ' + n + ' bulto(s).', 'ok', 3500); }
      else UI.toast('Configuración guardada', 'ok');
    },
    guardarRem: function () {
      var r = EnvioDatos.leerForm('rmD_'), er = EnvioDatos.errores(r, 'Remitente');
      if (er.length) { UI.toast(er.join(' · '), 'error', 6000); return; }
      c.remitente = EnvioDatos.tieneDatos(r) ? r : null;
      DB.guardarCfg();
      Compartida.subir(function (ok, msg) { UI.toast(ok ? 'Remitente guardado y compartido con todos los equipos' : (Compartida.activo() ? 'Guardado en este equipo; no se pudo compartir: ' + (msg || '') : 'Remitente guardado (solo este equipo)'), ok ? 'ok' : 'warn', 4000); });
    },
    exportar: function () { StorageManager.backup(); },
    verArchivados: function () { UI.descargar('rdm_archivados_' + U.sello() + '.json', JSON.stringify(StorageManager.leer(CLAVES.archivados, []), null, 1), 'application/json'); },
    syGuardar: function () {
      if (U.$('syUrl')) {
        var u = U.trim(U.$('syUrl').value);
        if (u && !/^https:\/\/script\.google(usercontent)?\.com\//.test(u)) { UI.toast('La URL debe ser https://script.google.com/.../exec', 'error', 4000); return; }
        c.sync.url = u;
      }
      c.sync.token = U.trim(U.$('syTok').value);
      c.sync.sinConexion = false;
      c.sync.ultimoError = '';
      c.sync.intentosFallidos = 0;
      Activacion.avisado = false;
      if (c.sync.token) Compartida.bajar();
      DB.guardarCfg();
      UI.toast('Conexión guardada', 'ok');
      App.ir('datos');
      if (Sync.modo() !== 'local') Sync.ejecutar();
    },
    syAhora: function () {
      if (Sync.modo() === 'local') { UI.toast('Sin conexión configurada', 'error'); return; }
      c.sync.intentosFallidos = 0; DB.guardarCfg();
      UI.toast('Sincronizando…', '', 8000);
      Sync.ejecutar(function (ok, msg) { UI.toast(ok ? 'Sincronizado' : 'Error: ' + msg, ok ? 'ok' : 'error', 4000); if (App.pantalla === 'datos' && !UI.abierto()) App.ir('datos'); });
    },
    syAlta: function () { Alta.compartir(); },
    enlWsp: function () { window.location.href = 'https://wa.me/?text=' + encodeURIComponent('Enlace Satélite RD Músico (ábrelo en tu equipo, en Chrome):\n' + U.$('cfEnl').value); },
    enlCopiar: function () {
      var i = U.$('cfEnl'), ok = false;
      try { i.focus(); i.select(); i.setSelectionRange(0, 99999); ok = document.execCommand('copy'); } catch (e) {}
      UI.toast(ok ? 'Enlace copiado' : 'Mantenga presionado el enlace para copiarlo', ok ? 'ok' : 'warn', 3500);
    },
    syProbar: function () {
      if (Sync.modo() === 'local') { UI.toast('Sin conexión configurada', 'error'); return; }
      Sync.llamar('satInfo', {}, function (r) {
        UI.modal({ titulo: 'Conexión OK', html: '<div class="tot">Hoja: <b>' + U.esc(r.nombre) + '</b><br>Versión servidor: ' + U.esc(r.version) + '<br>OT en la hoja: <b>' + r.ots + '</b><br>Productos: <b>' + r.catalogo + '</b>' + (r.catalogoActualizado ? ' (' + U.esc(r.catalogoActualizado) + ')' : '') + '<br>Clave exigida: ' + (r.conClave ? 'SÍ' : 'NO') + '</div>' });
      }, function (msg) { UI.modal({ titulo: 'Sin conexión', html: '<div class="aviso rojo">' + U.esc(msg) + '</div>' }); });
    },
    syTodo: function () {
      UI.confirmar('Se volverán a descargar todas las OT de la hoja. Lo pendiente de este equipo se sube primero.', function () {
        c.sync.ultimaBajada = ''; c.sync.intentosFallidos = 0; DB.guardarCfg();
        Sync.ejecutar(function (ok, msg) { UI.toast(ok ? 'Descarga completa' : 'Error: ' + msg, ok ? 'ok' : 'error', 4000); });
      }, { si: 'DESCARGAR' });
    },
    verRespaldo: function () { UI.mostrarTexto('Respaldo JSON', JSON.stringify(StorageManager.exportar())); },
    importarTxt: function () { if (!U.trim(U.$('rsTxt').value)) { UI.toast('Pegue el contenido del respaldo', 'error'); return; } restaurar(U.$('rsTxt').value); },
    borrarTodo: function () {
      UI.modal({ titulo: 'Borrar todos los datos', html: '<div class="aviso rojo">Se eliminarán OT, bultos, catálogo, formatos y configuración de ESTE equipo. Lo que está en la hoja Google no se borra.</div><label class="lbl">Escriba BORRAR para confirmar</label><input id="bdTxt" class="inp" autocapitalize="characters">',
        botones: [{ txt: 'CANCELAR', cls: 'btn-sec' }, { txt: 'BORRAR TODO', cls: 'btn-dan', fn: function () {
          if (U.norm(U.$('bdTxt').value) !== 'BORRAR') { UI.toast('Escriba BORRAR', 'error'); return false; }
          for (var k in CLAVES) StorageManager.eliminar(CLAVES[k]);
          DB.cargar();
          UI.toast('Datos borrados', 'warn');
          App.ir('datos');
        } }] });
    }
  });
  U.$('rsFile').onchange = function () {
    var f = this.files && this.files[0]; if (!f) return;
    var fr = new FileReader(); fr.onload = function () { restaurar(fr.result); }; fr.readAsText(f, 'utf-8');
    this.value = '';
  };
};

var Integridad = {
  verificar: function () {
    var fallas = [], n = 0;
    var req = { U: typeof U, StorageManager: typeof StorageManager, DB: typeof DB, OT: typeof OT, CubPool: typeof CubPool, Catalogo: typeof Catalogo, CSV: typeof CSV, Sync: typeof Sync,
      Code128: typeof Code128, Impresion: typeof Impresion, Plantillas: typeof Plantillas, UI: typeof UI, App: typeof App, Pantallas: typeof Pantallas, PackingUI: typeof PackingUI, DespachoGrupo: typeof DespachoGrupo };
    for (var k in req) { n++; if (req[k] !== 'object') fallas.push('módulo ' + k); }
    var pant = ['inicio', 'pedidos', 'cubicacion', 'packing', 'despacho', 'manifiesto', 'seguimiento', 'rotulado', 'catalogo', 'datos'];
    for (var i = 0; i < pant.length; i++) { n++; if (typeof Pantallas[pant[i]] !== 'function') fallas.push('pantalla ' + pant[i]); }
    n++; if (typeof RDM_FIN_SCRIPT === 'undefined' || RDM_FIN_SCRIPT !== APP.version) fallas.push('fin de script');
    n++; if (!document.getElementById('printArea') || !document.getElementById('pageRule')) fallas.push('estructura HTML');
    n++; try { var c = OT.calcular(40, 30, 25); if (c.volumen !== 0.03) fallas.push('cubicación'); } catch (e) { fallas.push('cubicación'); }
    n++; if (OT.docKey('  oc-4589 ', 'FACTURA', '4925 ') !== 'OC-4589|FACTURA|4925') fallas.push('clave documento');
    n++; try { var b = Code128.codificar('RDM'); if (!b || b.codigos.join(',') !== '104,50,36,45,52,106') fallas.push('Code128'); } catch (e) { fallas.push('Code128'); }
    n++; if (Code128.tabla.length !== 107) fallas.push('tabla Code128');
    return { ok: !fallas.length, fallas: fallas, revisados: n };
  }
};

var RDM_FIN_SCRIPT = APP.version;
App.init();
</script>
</body>
</html>
