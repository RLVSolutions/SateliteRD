      f=s.split('|'); var z=[]; for(i=0;i<f.length;i++){var c=Pedidos._limpiarCelda(f[i]);if(c!=='' || (i>0&&i<f.length-1))z.push(c);}

      else if(/^(PEDIDO|NUMEROPEDIDO|ORDEN|NUMEROORDEN|ORDENTICKET|TICKET|OC|NUMEROOC)$/.test(k)){mapa.numero=i;reconocidas++;}

      else if(/^FECHA/.test(k)){mapa.fecha=i;reconocidas++;}
      else if(/^(TOTAL|MONTO|VALOR|IMPORTE)$/.test(k)){mapa.monto=i;reconocidas++;}
    }

      if(Pedidos.existeIdentidad(p)){duplicados++;continue;}
      var r=Pedidos.upsert(p);

      else invalidos++;

  if (sel && l.indexOf(sel) < 0) l.push(sel);
  U.each(l, function (c) { h += '<option value="' + U.esc(c) + '"' + (c === sel ? ' selected' : '') + '>' + U.esc(c) + '</option>'; });
  return h;
}

var CubPool = {
  lista: [], ultimo: null, filtro: '',
  cargar: function () {
    var l = StorageManager.leer(CLAVES.cubicacion, []); CubPool.lista = U.esArray(l) ? l : [];
    U.each(CubPool.lista, function (b) {
      if (!b.tipoDocumento) b.tipoDocumento = 'FACTURA';
      if (!b.numeroDocumento) b.numeroDocumento = b.factura || '';
      b.factura = b.numeroDocumento;
      if (!b.estado) b.estado = b.otId ? 'ASIGNADO' : 'DISPONIBLE';
    });
  },
  guardar: function () { StorageManager.guardar(CLAVES.cubicacion, CubPool.lista); CubPool.subir(); },
  subir: function () {
    if (typeof Sync === 'undefined' || Sync.modo() === 'local') return;
    Sync.llamar('satGuardarCubicaciones', { bultos: CubPool.lista, dispositivo: DB.cfg.sync.dispositivo }, function () {}, function () {});
  },
  bajar: function (cb) {
    if (typeof Sync === 'undefined' || Sync.modo() === 'local') { if (cb) cb(); return; }
    Sync.llamar('satCubicaciones', {}, function (r) {
      if (r && U.esArray(r.bultos)) { CubPool.lista = r.bultos; StorageManager.guardar(CLAVES.cubicacion, CubPool.lista); }
      if (cb) cb();
    }, function () { if (cb) cb(); });
  },
  siguienteId: function () {
    var ymd = U.fechaISO().replace(/-/g, ''), pref = 'CUB-' + ymd + '-', max = 0;
    U.each(CubPool.lista, function (b) { var x = String(b.cubicacionId || ''); if (x.indexOf(pref) === 0) { var n = parseInt(x.substr(pref.length), 10) || 0; if (n > max) max = n; } });
    return pref + U.pad(max + 1, 4);
  },
  agregar: function (d) {
    var c = OT.calcular(d.ancho, d.alto, d.largo), a = new Date(), cub = d.cubicacionId || CubPool.siguienteId();
    var mismos = U.filter(CubPool.lista, function (x) { return x.cubicacionId === cub; });
    var b = { id: U.uid('cub-'), pedidoId: d.pedidoId || '', cubicacionId: cub, numero: mismos.length + 1, orden: U.norm(d.orden), tipoDocumento: U.norm(d.tipoDocumento || 'FACTURA'), numeroDocumento: U.norm(d.numeroDocumento), factura: U.norm(d.numeroDocumento), ancho: d.ancho, alto: d.alto, largo: d.largo, peso: d.peso, volumen: c.volumen, pesoVol: c.pesoVol, fecha: U.fechaISO(a), hora: U.hora(a), estado: 'DISPONIBLE', otId: '', otNumero: '', act: a.toISOString() };
    CubPool.lista.push(b); CubPool.ultimo = { ancho: b.ancho, alto: b.alto, largo: b.largo, peso: b.peso }; CubPool.guardar(); return b;
  },
  disponibles: function (orden) { return U.filter(CubPool.lista, function (b) { return b.estado === 'DISPONIBLE' && (!orden || U.norm(b.orden) === U.norm(orden)); }); },
  asignar: function (ids, ot) {
    if (!OT.editable(ot)) return 0;
    var n = 0;
    U.each(ids, function (id) {
      var b = U.find(CubPool.lista, function (x) { return x.id === id; }); if (!b || b.estado !== 'DISPONIBLE') return;
      var d = { orden: b.orden, tipoDocumento: b.tipoDocumento, numeroDocumento: b.numeroDocumento, factura: b.numeroDocumento, ancho: b.ancho, alto: b.alto, largo: b.largo, peso: b.peso, courier: '', ordenCourier: '' };
      var nb = OT.agregarBulto(ot, d, 0); if (nb) { nb.origenCubicacionId = b.id; b.estado = 'ASIGNADO'; b.otId = ot.id; b.otNumero = ot.numero; b.act = new Date().toISOString(); n++; }
    });
    OT._limpiarDocsVacios(ot); OT.recalcular(ot); OT.recalcularDespacho(ot);
    StorageManager.guardar(CLAVES.cubicacion, CubPool.lista); StorageManager.guardar(CLAVES.ordenes, OT.lista);
    CubPool.subir(); if (typeof Sync !== 'undefined') Sync.marcarOT(ot.id); return n;
  },
  borrar: function (id, aut) {
    var b = U.find(CubPool.lista, function (x) { return x.id === id; });
    if (!b) return { ok: false, msg: 'Bulto no encontrado' };
    if (b.estado !== 'DISPONIBLE') return { ok: false, msg: 'Bulto asociado a OT ' + b.otNumero + '. Libérelo primero.', dependiente: 'OT ' + b.otNumero };
    CubPool.lista = U.filter(CubPool.lista, function (x) { return x.id !== id; });
    CubPool.guardar();
    return { ok: true };
  },
  liberar: function (id) {
    var b = U.find(CubPool.lista, function (x) { return x.id === id; });
    if (!b || b.estado !== 'ASIGNADO') return false;
    b.estado = 'DISPONIBLE'; b.otId = ''; b.otNumero = ''; b.act = new Date().toISOString();
    CubPool.guardar(); return true;
  }
};

    botones.push({ txt: 'LIBERAR DE OT', cls: 'btn-warn', fn: function () {

    b.ancho = d.ancho; b.alto = d.alto; b.largo = d.largo; b.peso = d.peso; b.volumen = c.volumen; b.pesoVol = c.pesoVol;

    UI.toast('Bulto actualizado', 'ok'); App.ir('cubicacion');

Pantallas.pedidos = function (m) {
  Pedidos.reconciliarEstados();
  var estadoFiltro = 'VIGENTES', canalFiltro = 'TODOS';
  var render = function () {
    var q = U.norm((U.$('peBuscar') && U.$('peBuscar').value) || ''), hh='', n=0;
    var l = Pedidos.lista.slice(0);
    l.sort(function(a,b){ return String(a.fecha||'') < String(b.fecha||'') ? 1 : -1; });

      if (estadoFiltro === 'VIGENTES' && ['CUBICADO','EN PREPARACIÓN','ENVIADO','ENTREGADO','CANCELADO'].indexOf(p.estado)>=0) return;
      if (estadoFiltro === 'HISTÓRICO' && ['CUBICADO','EN PREPARACIÓN','ENVIADO','ENTREGADO','CANCELADO'].indexOf(p.estado)<0) return;
      if (estadoFiltro !== 'TODOS' && estadoFiltro !== 'VIGENTES' && estadoFiltro !== 'HISTÓRICO' && p.estado !== estadoFiltro) return;
      if (canalFiltro !== 'TODOS' && U.norm(p.origen)!==canalFiltro) return;
      if(q && U.norm([p.numero,p.origen,p.tipo,p.tipoDocumento,p.numeroDocumento,p.estado].join(' ')).indexOf(q)<0)return;
      n++;
      var cls = p.estado === 'ENTREGADO' ? 'COMPLETO' : (p.estado === 'CANCELADO' ? 'ANULADO' : (p.estado === 'ENVIADO' ? 'COMPLETO' : (p.estado === 'CUBICADO' || p.estado === 'EN PREPARACIÓN' ? 'PARCIAL' : 'PENDIENTE')));

    });

    '<div class="fila"><div class="c"><label class="lbl">ETAPA / ESTADO</label><select id="peFiltro" class="inp sm"><option>VIGENTES</option><option>HISTÓRICO</option><option>TODOS</option>'+U.map(Pedidos.estados,function(e){return '<option>'+U.esc(e)+'</option>';}).join('')+'</select></div><div class="c"><label class="lbl">CANAL</label><select id="peCanal" class="inp sm"><option>TODOS</option>'+U.map(['WEB','M.P.','MERCADOLIBRE','ERP','MANUAL','EXCEL','OTRO'],function(c){return '<option>'+c+'</option>';}).join('')+'</select></div></div>'+
    '<div id="peConteo" class="muted" style="margin:8px 0"></div><div id="peLista"></div></div>';

        UI.cerrarModal();render();UI.toast('Pedido guardado','ok');return false;

          return false;
        }}]});
    }
  });
  m.oninput=function(e){if(e.target.id==='peBuscar')render();};
  m.onchange=function(e){if(e.target.id==='peFiltro'){estadoFiltro=e.target.value;render();} if(e.target.id==='peCanal'){canalFiltro=U.norm(e.target.value);render();}};
  render();
};

Pantallas.cubicacion = function (m) {
  Pedidos.reconciliarEstados();
  if (CubUI.pedidoId && Pedidos.porId(CubUI.pedidoId) && Pedidos.porId(CubUI.pedidoId).estado !== 'RECIBIDO') CubUI.pedidoId = null;
  if (!CubUI.cubId) CubUI.cubId = CubPool.siguienteId();
  var pedSel = CubUI.pedidoId ? Pedidos.porId(CubUI.pedidoId) : null;

    h += '<div class="bl efRow" data-k="' + k + '"><div class="i"><label class="chk" style="padding:4px 0"><input type="checkbox" class="efOn"' + (on ? ' checked' : '') + '>' + U.esc(CAMPOS_PRODUCTO[k]) + '</label>' +

      '<label style="font-size:13px"><input type="checkbox" class="efB"' + (cf.b ? ' checked' : '') + '>N</label>' +
      '<button class="mini" data-ef="up">↑</button></div></div>';
  });
  h += '<label class="chk"><input type="checkbox" id="efBar"' + (f.barra ? ' checked' : '') + '> Código de barras (Code 128)</label>' +
    '<div class="fila"><div class="c2"><label class="lbl">VALOR DEL CÓDIGO</label><select id="efCB" class="inp sm"><option value="auto"' + (f.campoBarra === 'auto' ? ' selected' : '') + '>Barras si es válido, si no SKU</option>' +
    '<option value="codigo"' + (f.campoBarra === 'codigo' ? ' selected' : '') + '>Código/SKU</option><option value="codigoBarra"' + (f.campoBarra === 'codigoBarra' ? ' selected' : '') + '>Cód. barras</option></select></div>' +
    '<div class="c"><label class="lbl">ALTO mm</label><input id="efBA" class="inp sm" type="number" min="5" max="30" value="' + (f.altoBarra || 10) + '"></div></div>' +
    '<label class="chk"><input type="checkbox" id="efBT"' + (f.textoBarra ? ' checked' : '') + '> Texto bajo el código</label>';
  var botones = [{ txt: 'CANCELAR', cls: 'btn-sec' }];
  if (idx >= 0) botones.push({ txt: 'ELIMINAR', cls: 'btn-dan', fn: function () {

  botones.push({ txt: 'GUARDAR', cls: 'btn-ok', fn: function () {

    if (!campos.length && !nf.barra) { UI.toast('Marque al menos un campo o el código de barras', 'error'); return false; }

  var host = UI.modal({ titulo: idx >= 0 ? 'Editar formato' : 'Nuevo formato', html: h, botones: botones });

    prev(e);
  };

var CatUI = { q: '', max: 50 };

  m.innerHTML = '<div class="card"><label class="lbl">BUSCAR</label><input id="ctQ" class="inp" type="text" autocomplete="off" autocorrect="off" spellcheck="false" value="' + U.esc(CatUI.q) + '">' +

    var r = Catalogo.buscar(CatUI.q, 0), h = '';

      h += '<div class="it" data-a="editar" data-x="' + U.esc(p.codigo) + '" style="cursor:pointer"><div class="c1">' + U.esc(p.codigo) + (p.precio ? ' · ' + U.clp(p.precio) : '') + '</div>' +

        '<div class="c2">' + U.esc([p.marca, p.familia, p.codigoBarra, p.ubicacion ? ('UBICACIÓN: ' + p.ubicacion) : ''].join(' · ').replace(/^( · )+|( · )+$/g, '')) + '</div>' +
        '<div class="btns"><button class="btn btn-sec btn-sm" data-a="gimg" data-x="' + U.esc(p.codigo) + '">IMÁGENES</button><button class="btn btn-sec btn-sm" data-a="editar" data-x="' + U.esc(p.codigo) + '">EDITAR</button></div></div>';

CatUI.importar = function (alFin) {

        var r = Catalogo.importar(d.productos, modo);

        UI.toast('Importación OK: ' + r.nuevos + ' nuevos, ' + r.actualizados + ' actualizados', 'ok', 3500);

Pantallas.datos = function (m) {

    (modo === 'gas' ? '' : '<label class="lbl">URL DE LA HOJA (termina en /exec)</label><input id="syUrl" class="inp sm" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="' + U.esc((window.SAT_CONFIG && /^https:/.test(SAT_CONFIG.API_URL || '')) ? SAT_CONFIG.API_URL : '') + '" value="' + U.esc(sy.url) + '">') +
    '<label class="lbl">CLAVE DE ACCESO</label><input id="syTok" class="inp sm" type="password" value="' + U.esc(sy.token) + '">' +
    '<button class="btn" data-a="syGuardar">GUARDAR CONEXIÓN</button>' +

    '<div class="muted">Equipo: ' + U.esc(sy.dispositivo) + '</div></div>';
  h += '<div class="card"><h2>Respaldo</h2>' +
    '<div class="tot">OT: <b>' + OT.lista.length + '</b> · Bultos: <b>' + nb + '</b> · Productos: <b>' + Catalogo.lista.length + '</b> · Formatos: <b>' + DB.formatos.length + '</b><br>' +
    '<span class="muted">Uso almacenamiento: ' + U.fx(StorageManager.uso() / 1024, 0) + ' KB (límite ≈ 5000 KB)</span></div>' +

    '<label class="lbl">IMPORTAR RESPALDO (.json)</label><input id="rsFile" type="file" accept=".json,application/json,text/plain" class="inp sm" style="padding:8px">' +

    '<button class="btn btn-sec" data-a="importarTxt">ANALIZAR PEGADO</button></div>';
  var integ = Integridad.verificar();
  h += '<div class="card"><h2>Integridad</h2><div class="aviso ' + (integ.ok ? 'verde' : 'rojo') + '">' + (integ.ok ? 'ARCHIVO COMPLETO · ' + integ.revisados + ' controles OK' : 'FALLAS: ' + U.esc(integ.fallas.join(', '))) + '</div>' +
    '<div class="muted">' + U.esc(APP.nombre) + ' v' + APP.version + ' (' + APP.build + ') · ' + (StorageManager.disponible ? 'localStorage' : 'MEMORIA') + '</div>' +

  h += '<div class="card"><h2>Zona peligrosa</h2><button class="btn btn-dan" data-a="borrarTodo">BORRAR TODOS LOS DATOS</button></div>';
  m.innerHTML = h;
  var restaurar = function (txt) {

    if (!v.ok) { UI.modal({ titulo: 'Respaldo inválido', html: '<div class="aviso rojo">' + U.esc(v.error) + '</div>' }); return; }
    var r = v.resumen, f = r.fecha ? new Date(r.fecha) : null;
    UI.modal({ titulo: 'Restaurar respaldo', html: '<div class="tot">Fecha: <b>' + (f && !isNaN(f.getTime()) ? U.fechaCL(U.fechaISO(f)) + ' ' + U.hora(f) : '?') + '</b><br>' +
      'Versión: ' + U.esc(r.version) + '<br>OT: <b>' + r.ots + '</b> · Bultos: <b>' + r.bultos + '</b> · Productos: <b>' + r.productos + '</b></div>' +
      '<div class="aviso rojo" style="margin-top:8px">Se REEMPLAZARÁN los datos actuales.</div>' +
      '<label class="chk"><input type="checkbox" id="rsPrev" checked> Descargar respaldo previo</label>',
      botones: [{ txt: 'CANCELAR', cls: 'btn-sec' }, { txt: 'RESTAURAR', cls: 'btn-dan', fn: function () {
        var prevBk = U.$('rsPrev').checked ? JSON.stringify(StorageManager.exportar()) : null, conn = U.clone(DB.cfg.sync);
        var res = StorageManager.importar(obj);
        if (!res.ok) { UI.toast(res.error, 'error', 5000); return; }
        DB.cargar();
        DB.cfg.sync = U.assign(U.clone(SYNC_DEFECTO), { url: conn.url, token: conn.token, dispositivo: conn.dispositivo });
        Sync.marcarTodo(); Sync.programar(1500);
        App.ir('datos');
        UI.toast('Respaldo restaurado', 'ok', 3000);
        if (prevBk) UI.descargar('rdm_respaldo_previo_' + U.sello() + '.json', prevBk, 'application/json', true);
        else UI.cerrarModal();
        return false;
      } }] });
  };
  UI.delegar(m, {
    guardarCfg: function () {
      var fv = parseInt(U.$('cfFv').value, 10);
      if (!(fv >= 1000 && fv <= 10000)) { UI.toast('Factor volumétrico entre 1000 y 10000', 'error'); return; }
      var cambioFv = fv !== c.factorVol;
      c.empresa = U.trim(U.$('cfEmp').value) || 'RD MUSICO';
      c.subtitulo = U.trim(U.$('cfSub').value);
      c.factorVol = fv;
      c.barraBulto = U.$('cfBb').checked;
      if (U.$('cfFb')) c.formatoBulto = U.$('cfFb').value;
      c.autoImprimir = U.$('cfAi').checked;
      var cous = [];
      U.each(U.$('cfCou').value.split(/\r?\n/), function (x) { x = U.norm(x); if (x && cous.indexOf(x) < 0) cous.push(x); });
      if (cous.length) c.couriers = cous;
      c.claveAdmin = String(U.$('cfAdm').value || '');
      c.nombreAdmin = U.trim(U.$('cfAdmNom').value);
      c.equipo = U.norm(U.$('cfEq').value).replace(/[^A-Z0-9]/g, '');
      if (U.$('cfWsp')) c.whatsapp = String(U.$('cfWsp').value || '').replace(/[^0-9]/g, '');
      DB.guardarCfg();
      Compartida.subir(function (ok) { if (ok) UI.toast('Configuración guardada y compartida con todos los equipos', 'ok', 3500); });
      if (cambioFv) { var n = OT.recalcularPesoVol(); UI.toast('Guardado. Peso volumétrico recalculado en ' + n + ' bulto(s).', 'ok', 3500); }
      else UI.toast('Configuración guardada', 'ok');
    },
    exportar: function () { StorageManager.backup(); },
    syGuardar: function () {
      if (U.$('syUrl')) {
        var u = U.trim(U.$('syUrl').value);
        if (u && !/^https:\/\/script\.google(usercontent)?\.com\//.test(u)) { UI.toast('La URL debe ser https://script.google.com/.../exec', 'error', 4000); return; }
        c.sync.url = u;
      }
      c.sync.token = U.trim(U.$('syTok').value);
      c.sync.sinConexion = false;
      c.sync.ultimoError = '';
      c.sync.intentosFallidos = 0;
      Activacion.avisado = false;
      if (c.sync.token) Compartida.bajar();
      DB.guardarCfg();
      UI.toast('Conexión guardada', 'ok');
      App.ir('datos');
      if (Sync.modo() !== 'local') Sync.ejecutar();
    },
    syAhora: function () {
      if (Sync.modo() === 'local') { UI.toast('Sin conexión configurada', 'error'); return; }
      c.sync.intentosFallidos = 0; DB.guardarCfg();
      UI.toast('Sincronizando…', '', 8000);
      Sync.ejecutar(function (ok, msg) { UI.toast(ok ? 'Sincronizado' : 'Error: ' + msg, ok ? 'ok' : 'error', 4000); if (App.pantalla === 'datos' && !UI.abierto()) App.ir('datos'); });
    },
    syAlta: function () { Alta.compartir(); },
    enlWsp: function () { window.location.href = 'https://wa.me/?text=' + encodeURIComponent('Enlace Satélite RD Músico (ábrelo en tu equipo, en Chrome):\n' + U.$('cfEnl').value); },
    enlCopiar: function () {
      var i = U.$('cfEnl'), ok = false;
      try { i.focus(); i.select(); i.setSelectionRange(0, 99999); ok = document.execCommand('copy'); } catch (e) {}
      UI.toast(ok ? 'Enlace copiado' : 'Mantenga presionado el enlace para copiarlo', ok ? 'ok' : 'warn', 3500);
    },
    syProbar: function () {
      if (Sync.modo() === 'local') { UI.toast('Sin conexión configurada', 'error'); return; }
      Sync.llamar('satInfo', {}, function (r) {
        UI.modal({ titulo: 'Conexión OK', html: '<div class="tot">Hoja: <b>' + U.esc(r.nombre) + '</b><br>Versión servidor: ' + U.esc(r.version) + '<br>OT en la hoja: <b>' + r.ots + '</b><br>Productos: <b>' + r.catalogo + '</b>' + (r.catalogoActualizado ? ' (' + U.esc(r.catalogoActualizado) + ')' : '') + '<br>Clave exigida: ' + (r.conClave ? 'SÍ' : 'NO') + '</div>' });
      }, function (msg) { UI.modal({ titulo: 'Sin conexión', html: '<div class="aviso rojo">' + U.esc(msg) + '</div>' }); });
    },
    syTodo: function () {
      UI.confirmar('Se volverán a descargar todas las OT de la hoja. Lo pendiente de este equipo se sube primero.', function () {
        c.sync.ultimaBajada = ''; c.sync.intentosFallidos = 0; DB.guardarCfg();
        Sync.ejecutar(function (ok, msg) { UI.toast(ok ? 'Descarga completa' : 'Error: ' + msg, ok ? 'ok' : 'error', 4000); });
      }, { si: 'DESCARGAR' });
    },
    verRespaldo: function () { UI.mostrarTexto('Respaldo JSON', JSON.stringify(StorageManager.exportar())); },
    importarTxt: function () { if (!U.trim(U.$('rsTxt').value)) { UI.toast('Pegue el contenido del respaldo', 'error'); return; } restaurar(U.$('rsTxt').value); },
    borrarTodo: function () {
      UI.modal({ titulo: 'Borrar todos los datos', html: '<div class="aviso rojo">Se eliminarán OT, bultos, catálogo, formatos y configuración de ESTE equipo. Lo que está en la hoja Google no se borra.</div><label class="lbl">Escriba BORRAR para confirmar</label><input id="bdTxt" class="inp" autocapitalize="characters">',
        botones: [{ txt: 'CANCELAR', cls: 'btn-sec' }, { txt: 'BORRAR TODO', cls: 'btn-dan', fn: function () {
          if (U.norm(U.$('bdTxt').value) !== 'BORRAR') { UI.toast('Escriba BORRAR', 'error'); return false; }
          for (var k in CLAVES) StorageManager.eliminar(CLAVES[k]);
          DB.cargar();
          UI.toast('Datos borrados', 'warn');
          App.ir('datos');
        } }] });
    }
  });
  U.$('rsFile').onchange = function () {
    var f = this.files && this.files[0]; if (!f) return;
    var fr = new FileReader(); fr.onload = function () { restaurar(fr.result); }; fr.readAsText(f, 'utf-8');
    this.value = '';
  };
};

var Integridad = {
  verificar: function () {
    var fallas = [], n = 0;
    var req = { U: typeof U, StorageManager: typeof StorageManager, DB: typeof DB, OT: typeof OT, CubPool: typeof CubPool, Catalogo: typeof Catalogo, CSV: typeof CSV, Sync: typeof Sync,
      Code128: typeof Code128, Impresion: typeof Impresion, Plantillas: typeof Plantillas, UI: typeof UI, App: typeof App, Pantallas: typeof Pantallas, PackingUI: typeof PackingUI, DespachoGrupo: typeof DespachoGrupo };
    for (var k in req) { n++; if (req[k] !== 'object') fallas.push('módulo ' + k); }
    var pant = ['inicio', 'pedidos', 'cubicacion', 'packing', 'despacho', 'manifiesto', 'seguimiento', 'rotulado', 'catalogo', 'datos'];
    for (var i = 0; i < pant.length; i++) { n++; if (typeof Pantallas[pant[i]] !== 'function') fallas.push('pantalla ' + pant[i]); }
    n++; if (typeof RDM_FIN_SCRIPT === 'undefined' || RDM_FIN_SCRIPT !== APP.version) fallas.push('fin de script');
    n++; if (!document.getElementById('printArea') || !document.getElementById('pageRule')) fallas.push('estructura HTML');
    n++; try { var c = OT.calcular(40, 30, 25); if (c.volumen !== 0.03) fallas.push('cubicación'); } catch (e) { fallas.push('cubicación'); }
    n++; if (OT.docKey('  oc-4589 ', 'FACTURA', '4925 ') !== 'OC-4589|FACTURA|4925') fallas.push('clave documento');
    n++; try { var b = Code128.codificar('RDM'); if (!b || b.codigos.join(',') !== '104,50,36,45,52,106') fallas.push('Code128'); } catch (e) { fallas.push('Code128'); }
    n++; if (Code128.tabla.length !== 107) fallas.push('tabla Code128');
    return { ok: !fallas.length, fallas: fallas, revisados: n };
  }
};

var RDM_FIN_SCRIPT = APP.version;
App.init();
</script>
